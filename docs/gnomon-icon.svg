<svg xmlns="http://www.w3.org/2000/svg" viewBox="290 50 952 952" width="512" height="512" role="img" aria-labelledby="gn-t" color="#111111">
  <title id="gn-t">Gnomon</title>
  <!-- Gnomon icon, in its own pixel coordinates.
       Everything is currentColor; the dial face, the node centres and the blade's face are transparent,
       so the icon follows the colour of whatever it sits on. -->
  <defs>
    <!-- blade knock-out: hides what lies behind the blade, with a small gap around it -->
    <mask id="gn-m-blade" maskUnits="userSpaceOnUse" x="290" y="50" width="952" height="952">
      <rect x="290" y="50" width="952" height="952" fill="#fff"/>
      <path d="M1029,130 L958,205 L679,603 L736,638 L764,631 L893,598 Z" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
    </mask>
    <!-- edges stop at the node rims and behind the blade -->
    <mask id="gn-m-edges" maskUnits="userSpaceOnUse" x="290" y="50" width="952" height="952">
      <rect x="290" y="50" width="952" height="952" fill="#fff"/>
      <g fill="#000">
        <ellipse cx="623" cy="431" rx="34" ry="21"/>
        <ellipse cx="415" cy="551" rx="34" ry="21"/>
        <ellipse cx="1018" cy="470" rx="34" ry="21"/>
        <ellipse cx="1132" cy="600" rx="34" ry="21"/>
        <ellipse cx="714" cy="640" rx="34" ry="21"/>
        <ellipse cx="459" cy="712" rx="34" ry="21"/>
        <ellipse cx="1013" cy="735" rx="34" ry="21"/>
        <ellipse cx="733" cy="805" rx="34" ry="21"/>
      </g>
      <path d="M1029,130 L958,205 L679,603 L736,638 L764,631 L893,598 Z" fill="#000" stroke="#000" stroke-width="22" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g fill="currentColor" stroke="none">
    <!-- the dial: an oblique disc with a thick solid rim below; the face is a hole -->
    <path mask="url(#gn-m-blade)" fill-rule="evenodd"
      d="M303,620 A462,267 0 0 1 1227,620 L1227,655 A462,267 0 0 1 303,655 Z
         M329,615 a436,244 0 1 0 872,0 a436,244 0 1 0 -872,0 Z"/>
  </g>

  <!-- the graph on the dial -->
  <g mask="url(#gn-m-edges)" stroke="currentColor" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="623" y1="431" x2="415" y2="551"/>
    <line x1="623" y1="431" x2="1018" y2="470"/>
    <line x1="623" y1="431" x2="714" y2="640"/>
    <line x1="415" y1="551" x2="714" y2="640"/>
    <line x1="415" y1="551" x2="459" y2="712"/>
    <line x1="459" y1="712" x2="714" y2="640"/>
    <line x1="459" y1="712" x2="733" y2="805"/>
    <line x1="714" y1="640" x2="733" y2="805"/>
    <line x1="714" y1="640" x2="1013" y2="735"/>
    <line x1="733" y1="805" x2="1013" y2="735"/>
    <line x1="1013" y1="735" x2="1132" y2="600"/>
    <line x1="1018" y1="470" x2="1132" y2="600"/>
    <line x1="1018" y1="470" x2="714" y2="640"/>
    <line x1="1132" y1="600" x2="714" y2="640"/>
  </g>
  <g mask="url(#gn-m-blade)" stroke="currentColor" stroke-width="13" fill="none">
    <ellipse cx="623" cy="431" rx="34" ry="21"/>
    <ellipse cx="415" cy="551" rx="34" ry="21"/>
    <ellipse cx="1018" cy="470" rx="34" ry="21"/>
    <ellipse cx="1132" cy="600" rx="34" ry="21"/>
    <ellipse cx="714" cy="640" rx="34" ry="21"/>
    <ellipse cx="459" cy="712" rx="34" ry="21"/>
    <ellipse cx="1013" cy="735" rx="34" ry="21"/>
    <ellipse cx="733" cy="805" rx="34" ry="21"/>
  </g>

  <!-- the blade: an outlined face (hole) and a solid side -->
  <path fill="currentColor" fill-rule="evenodd" stroke="currentColor" stroke-width="3" stroke-linejoin="round"
    d="M1029,130 L958,205 L679,603 L736,638 L764,631 L893,598 Z
       M984,192 L700,597 L738,622 Z"/>
</svg>
