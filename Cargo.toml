[workspace]
resolver = "2"
members = ["crates/gnomon-core", "crates/gnomon-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"   # PyO3 maps panics to Python exceptions; never abort the host
